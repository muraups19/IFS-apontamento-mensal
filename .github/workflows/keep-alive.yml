# Mantém o projeto Supabase (plano gratuito) ativo.
# O Supabase pausa projetos gratuitos com pouca atividade durante 7 dias.
# Este fluxo chama a função public.keep_alive() a cada 3 dias.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC, a cada 3 dias
  workflow_dispatch:          # permite rodar manualmente em Actions > Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar keep_alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
